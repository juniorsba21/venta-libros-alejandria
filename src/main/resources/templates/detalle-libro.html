<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${libro.titulo} + ' | Alejandría'">Detalle | Alejandría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="py-5">

    <div class="container">

        <!-- Migas de pan -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Inicio</a></li>
                <li class="breadcrumb-item"><a th:href="@{/libros}">Libros</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${libro.titulo}">Título</li>
            </ol>
        </nav>

        <div class="row g-5">

            <!-- Imagen del libro -->
            <div class="col-12 col-md-5 text-center">
                <img th:src="@{'/img/' + ${libro.imagen}}" th:alt="${libro.titulo}" class="detalle-imagen">
            </div>

            <!-- Información del libro -->
            <div class="col-12 col-md-7">

                <h1 th:text="${libro.titulo}">Título del libro</h1>

                <p class="lead mb-1">
                    <span class="text-muted">Por</span>
                    <span th:text="${libro.autor}">Autor</span>
                </p>

                <span class="badge bg-secondary mb-3"
                      th:if="${libro.categoria != null}"
                      th:text="${libro.categoria.nombre}">Categoría</span>

                <p class="detalle-precio mb-3" th:text="'S/. ' + ${#numbers.formatDecimal(libro.precio, 1, 2)}">S/. 35.00</p>

                <!-- Stock -->
                <p class="mb-3">
                    <span class="text-success fw-bold" th:if="${libro.stock > 0}"
                          th:text="'Quedan ' + ${libro.stock} + (${libro.stock == 1} ? ' unidad' : ' unidades')">Quedan 10 unidades</span>
                    <span class="badge bg-danger fs-6" th:if="${libro.stock == 0}">Agotado</span>
                </p>

                <!-- Contador de cantidad (solo si hay stock) -->
                <div class="mb-3" th:if="${libro.stock > 0}">
                    <label class="form-label d-block fw-bold" for="cantidadDetalle">Cantidad</label>

                    <div class="contador">
                        <button type="button" class="btn-contador" onclick="cambiarCantidad(-1)" aria-label="Disminuir">
                            <i class="bi bi-dash"></i>
                        </button>

                        <input type="number" id="cantidadDetalle" class="form-control" value="1" min="1"
                               th:attr="max=${libro.stock}"
                               onchange="actualizarTotalDetalle()">

                        <button type="button" class="btn-contador" onclick="cambiarCantidad(1)" aria-label="Aumentar">
                            <i class="bi bi-plus"></i>
                        </button>
                    </div>
                </div>

                <p class="mb-3" th:if="${libro.stock > 0}">
                    <b>Total: S/. <span id="totalDetalle"
                                         th:attr="data-precio=${libro.precio}"
                                         th:text="${#numbers.formatDecimal(libro.precio, 1, 2)}">35.00</span></b>
                </p>

                <div class="d-flex gap-2 mb-4">
                    <button type="button" class="btn btn-agregar px-4"
                            th:if="${libro.stock > 0}"
                            th:attr="data-titulo=${libro.titulo}"
                            onclick="agregarAlCarrito(this.dataset.titulo)">
                        <i class="bi bi-cart"></i> Agregar
                    </button>

                    <button type="button" class="btn btn-secondary px-4" th:if="${libro.stock == 0}" disabled>
                        <i class="bi bi-x-circle"></i> Sin stock
                    </button>

                    <a th:href="@{/libros}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver al catálogo
                    </a>
                </div>

                <h5>Descripción</h5>
                <p th:text="${libro.descripcion}">Descripción del libro.</p>

                <!-- Ficha técnica -->
                <h5 class="mt-4">Detalles</h5>
                <dl class="row detalle-ficha">
                    <dt class="col-4">Autor</dt>
                    <dd class="col-8" th:text="${libro.autor}">Autor</dd>

                    <dt class="col-4" th:if="${libro.categoria != null}">Categoría</dt>
                    <dd class="col-8" th:if="${libro.categoria != null}" th:text="${libro.categoria.nombre}">Categoría</dd>

                    <dt class="col-4" th:if="${libro.editorial != null and !#strings.isEmpty(libro.editorial)}">Editorial</dt>
                    <dd class="col-8" th:if="${libro.editorial != null and !#strings.isEmpty(libro.editorial)}" th:text="${libro.editorial}">Editorial</dd>

                    <dt class="col-4" th:if="${libro.anio != null}">Año</dt>
                    <dd class="col-8" th:if="${libro.anio != null}" th:text="${libro.anio}">2020</dd>

                    <dt class="col-4" th:if="${libro.paginas != null}">N° de páginas</dt>
                    <dd class="col-8" th:if="${libro.paginas != null}" th:text="${libro.paginas}">300</dd>
                </dl>

            </div>
        </div>

    </div>

</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>

</html>
