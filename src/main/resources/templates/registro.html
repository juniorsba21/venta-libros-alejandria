<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Alejandría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6">
                
                <h1 class="text-center">Crear cuenta</h1>
                <p class="text-center">Regístrate para realizar tus compras.</p>

                <!-- IMPORTANTE: Agregamos th:action y th:object para Spring -->
                <form th:action="@{/registro}" th:object="${usuario}" method="post">
                    
                    <input type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">

                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <!-- th:field conecta el input con el atributo 'nombre' de la clase Usuario -->
                        <input type="text" class="form-control" placeholder="Ingresa tu nombre" 
                               th:field="*{nombre}" 
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                        <!-- Aquí Spring mostrará el mensaje si hay error -->
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" placeholder="Ingresa tu correo" 
                               th:field="*{correo}" 
                               th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" placeholder="Crea una contraseña" 
                               th:field="*{password}" 
                               th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <!-- NOTA: El campo confirmar contraseña lo he quitado porque Spring no lo valida directamente. 
                         Si lo necesitas, tendríamos que agregarlo a la entidad Usuario, pero por ahora lo omitimos para que funcione con el paso 6. -->
                         
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary w-100">Registrarme</button>
                    </div>
                </form>

                <p class="text-center mt-3">
                    ¿Ya tienes una cuenta? <a th:href="@{/login}">Inicia sesión</a>
                </p>

            </div>
        </div>
    </div>
</section>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
