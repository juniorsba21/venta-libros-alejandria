<section class="py-5">

    <div class="container">

        <h1 class="text-center mb-4">
            Administración
        </h1>

        <div class="text-end mb-3">

            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#libro">
                Agregar libro
            </button>

        </div>

        <div class="table-responsive">

            <table class="table table-bordered">

                <thead>

                    <tr>
                        <th>Libro</th>
                        <th>Autor</th>
                        <th>Precio</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>El Principito</td>
                        <td>Antoine de Saint-Exupéry</td>
                        <td>S/. 35.00</td>
                        <td>
                            <button class="btn btn-warning">
                                Editar
                            </button>

                            <button class="btn btn-danger">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>Hábitos atómicos</td>
                        <td>James Clear</td>
                        <td>S/. 59.00</td>
                        <td>
                            <button class="btn btn-warning">
                                Editar
                            </button>

                            <button class="btn btn-danger">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                    <tr>
                        <td>El Hobbit</td>
                        <td>J. R. R. Tolkien</td>
                        <td>S/. 49.00</td>
                        <td>
                            <button class="btn btn-warning">
                                Editar
                            </button>

                            <button class="btn btn-danger">
                                Eliminar
                            </button>
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

<div class="modal fade" id="libro">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Agregar libro
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <form>

                    <div class="mb-3">

                        <label class="form-label">
                            Título
                        </label>

                        <input type="text" class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Autor
                        </label>

                        <input type="text" class="form-control">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Precio
                        </label>

                        <input type="number" class="form-control">

                    </div>

                    <button type="submit" class="btn btn-success">
                        Guardar
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>
