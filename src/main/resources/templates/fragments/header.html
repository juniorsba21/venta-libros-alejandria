
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Header</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

    <!-- Menú de navegación reutilizable -->
    <nav th:fragment="header"
         class="navbar navbar-expand-lg bg-light">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" th:href="@{/}">
                <i class="bi bi-book"></i>
                Alejandría
            </a>

            <!-- Botón para celulares -->
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <!-- INICIO -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${paginaActual == 'index'} ? 'active' : ''"
                           th:href="@{/}">
                            Inicio
                        </a>
                    </li>

                    <!-- LIBROS -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${paginaActual == 'libros'} ? 'active' : ''"
                           th:href="@{/libros}">
                            Libros
                        </a>
                    </li>

                    <!-- CONTACTO -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:classappend="${paginaActual == 'contacto'} ? 'active' : ''"
                           th:href="@{/contacto}">
                            Contacto
                        </a>
                    </li>

                    <!-- INICIAR SESIÓN: solo visitantes -->
                    <li class="nav-item"
                        th:if="${#authorization.expression('isAnonymous()')}">

                        <a class="nav-link"
                           th:classappend="${paginaActual == 'login'} ? 'active' : ''"
                           th:href="@{/login}">

                            <i class="bi bi-person"></i>
                            Iniciar sesión
                        </a>
                    </li>

                    <!-- MI PERFIL: usuarios autenticados -->
                    <li class="nav-item"
                        th:if="${#authorization.expression('isAuthenticated()')}">

                        <a class="nav-link"
                           th:href="@{/perfil}">

                            <i class="bi bi-person-circle"></i>
                            Mi perfil
                        </a>
                    </li>

                    <!-- ADMINISTRACIÓN: solo administradores -->
                    <li class="nav-item"
                        th:if="${#authorization.expression('hasRole(''ADMIN'')')}">

                        <a class="nav-link"
                           th:classappend="${paginaActual == 'administracion'} ? 'active' : ''"
                           th:href="@{/admin}">

                            <i class="bi bi-gear"></i>
                            Administración
                        </a>
                    </li>

                    <!-- CERRAR SESIÓN -->
                    <li class="nav-item"
                        th:if="${#authorization.expression('isAuthenticated()')}">

                        <form th:action="@{/logout}" method="post">

                            <button type="submit"
                                    class="nav-link btn btn-link">

                                <i class="bi bi-box-arrow-right"></i>
                                Cerrar sesión
                            </button>

                        </form>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

</body>
</html>
