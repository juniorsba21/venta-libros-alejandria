<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros | Alejandría</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="py-5">

    <div class="container">

        <div class="text-center">

            <h1>
                Catálogo de libros
            </h1>

            <p class="lead">
                Encuentra el libro que estás buscando.
            </p>

        </div>

        <!-- Filtros: se generan con las categorías de la base de datos -->
        <div class="text-center my-4">

    <a class="btn filtro-btn me-1 mb-2"
       th:classappend="${categoriaSeleccionada == null} ? 'activo' : ''"
       th:href="@{/libros}">
        Todos
    </a>

    <a class="btn filtro-btn me-1 mb-2"
       th:each="cat : ${categorias}"
       th:classappend="${categoriaSeleccionada != null and categoriaSeleccionada == cat.id} ? 'activo' : ''"
       th:href="@{/libros(categoria=${cat.id})}"
       th:text="${cat.nombre}">
        Literatura
    </a>

</div>

        <!-- Mensaje si la categoría no tiene libros -->
        <p class="text-center text-muted" th:if="${#lists.isEmpty(libros)}">
            No hay libros en esta categoría todavía.
        </p>

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4 mb-4" th:each="libro : ${libros}">

                <div class="card">

                    <img th:src="@{'/img/' + ${libro.imagen}}" class="card-img-top" th:alt="${libro.titulo}">

                    <div class="card-body">

                        <h5 class="card-title" th:text="${libro.titulo}">
                            El Principito
                        </h5>

                        <p class="card-text" th:text="${libro.autor}">
                            Antoine de Saint-Exupéry
                        </p>

                        <p class="card-text" th:text="${libro.categoria.nombre}">
                            Literatura
                        </p>

                        <p class="fw-bold">
                            <span th:text="'S/. ' + ${libro.precio}">S/. 35.00</span>
                            <span class="badge bg-danger ms-2" th:if="${libro.stock == 0}">Agotado</span>
                        </p>

                        <!-- Ver detalle: ENLACE (<a>) que abre /libros/{id} -->
                        <a class="btn btn-primary me-2" th:href="@{/libros/{id}(id=${libro.id})}">
                            Ver detalle
                        </a>

                        <!-- Comprar: se desactiva si no hay stock -->
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#compra"
                                th:disabled="${libro.stock == 0}"
                                th:attr="data-libro=${libro.titulo},data-precio=${libro.precio}"
                                onclick="seleccionarLibro(this.dataset.libro, Number(this.dataset.precio))">
                            Comprar
                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

<!-- Modal de compra -->
<div class="modal fade" id="compra">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Comprar libro
                </h5>

                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>

            </div>

            <div class="modal-body">

                <p>
                    <b>Libro:</b> <span id="libro">El Principito</span>
                </p>

                <p>
                    <b>Precio:</b> S/. <span id="precio">35</span>
                </p>

                <label class="form-label">
                    Cantidad
                </label>

                <input type="number" id="cantidad" class="form-control" value="1" min="1" onchange="calcularTotal()">

                <p class="mt-3">
                    <b>Total: S/. <span id="total">35</span></b>
                </p>

            </div>

            <div class="modal-footer">

                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancelar
                </button>

                <button type="button" class="btn btn-success" onclick="comprar()">
                    Continuar
                </button>

            </div>

        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/script.js}"></script>

</body>

</html>
