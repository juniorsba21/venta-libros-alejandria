<!DOCTYPE html>

<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Alejandría</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" th:href="@{/css/estilos.css}">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<section class="py-5">

    <div class="container">

        <div class="text-center mb-4">

            <h1>
                Contáctanos
            </h1>

            <p class="lead">
                Si tienes alguna consulta, escríbenos.
            </p>

        </div>

        <div class="row">

            <div class="col-12 col-md-6">

                <h3>
                    Información de contacto
                </h3>

                <p>
                    <i class="bi bi-geo-alt"></i>
                    Lima, Perú
                </p>

                <p>
                    <i class="bi bi-envelope"></i>
                    contacto@alejandria.com
                </p>

                <p>
                    <i class="bi bi-telephone"></i>
                    999 999 999
                </p>

                <p>
                    Nuestro equipo estará disponible para ayudarte con tus consultas sobre libros,
                    pedidos y disponibilidad.
                </p>

            </div>

            <div class="col-12 col-md-6">

                <h3>
                    Envíanos un mensaje
                </h3>

                <form onsubmit="enviarFormulario(); return false;">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input type="text" class="form-control" placeholder="Ingresa tu nombre" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email" class="form-control" placeholder="Ingresa tu correo" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Asunto
                        </label>

                        <input type="text" class="form-control" placeholder="Escribe el asunto" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Mensaje
                        </label>

                        <textarea class="form-control" rows="5" placeholder="Escribe tu mensaje" required></textarea>

                    </div>

                    <button type="submit" class="btn btn-primary">
                        Enviar mensaje
                    </button>

                </form>

            </div>

        </div>

    </div>

</section>
<div th:replace="~{fragments/footer :: footer}"></div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/script.js"></script>

</body>

</html>
