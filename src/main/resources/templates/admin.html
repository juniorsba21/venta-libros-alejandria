<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Alejandría</title>
    <!-- Bootstrap para los estilos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Iconos de Bootstrap (opcional, por si usas los iconos en las categorías) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="bg-light">
    
<div th:replace="~{fragments/header :: header}"></div>
<div class="container mt-5 mb-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Panel de Administración</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary">Volver al Inicio</a>
    </div>

    <!-- ================= MENSAJES DE ALERTA ================= -->
    <!-- Mensaje de Éxito -->
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Mensaje de Error (Para cuando intentan borrar una categoría con libros) -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="row">
        <!-- ================= SECCIÓN LIBROS ================= -->
        <div class="col-lg-8 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Gestión de Libros</h4>
                    <a th:href="@{/admin/libros/nuevo}" class="btn btn-success btn-sm">+ Nuevo Libro</a>
                </div>
                <div class="card-body table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Título</th>
                                <th>Autor</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Bucle para listar los libros -->
                            <tr th:each="libro : ${libros}">
                                <td th:text="${libro.id}"></td>
                                <td th:text="${libro.titulo}"></td>
                                <td th:text="${libro.autor}"></td>
                                <!-- Mostramos el nombre de la categoría relacionada -->
                                <td th:text="${libro.categoria.nombre}"></td>
                                <td th:text="'S/ ' + ${libro.precio}"></td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <!-- Rutas corregidas y coincidentes con LibroAdminController -->
                                        <a th:href="@{/admin/libros/editar/{id}(id=${libro.id})}" class="btn btn-sm btn-warning">Editar</a>
                                        
                                        <form th:action="@{/admin/libros/eliminar/{id}(id=${libro.id})}"
                                            method="post"
                                            onsubmit="return confirm('¿Estás seguro de eliminar este libro?')">

                                            <button type="submit" class="btn btn-sm btn-danger">
                                            Eliminar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <!-- Mensaje si no hay libros -->
                            <tr th:if="${#lists.isEmpty(libros)}">
                                <td colspan="6" class="text-center text-muted py-4">No hay libros registrados aún.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ================= SECCIÓN CATEGORÍAS ================= -->
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h4 class="mb-0">Categorías</h4>
                    <a th:href="@{/admin/categorias/nuevo}" class="btn btn-success btn-sm">+ Nueva</a>
                </div>
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">
                        <!-- Bucle para listar categorías -->
                        <li th:each="cat : ${categorias}" class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <i th:class="'bi ' + ${cat.icono} + ' me-2 text-primary'"></i>
                                <span th:text="${cat.nombre}" class="fw-bold"></span>
                                <br>
                                <small class="text-muted" th:text="${cat.descripcion}"></small>
                            </div>
                            
                            <!-- Botones de Editar y Eliminar categoría -->
                            <div class="d-flex gap-1">

                                <a th:href="@{/admin/categorias/editar/{id}(id=${cat.id})}"
                                class="btn btn-sm btn-outline-warning">
                                Editar
                                </a>

                                <form th:action="@{/admin/categorias/eliminar/{id}(id=${cat.id})}"
                                method="post"
                                onsubmit="return confirm('¿Eliminar categoría?')">

                                <button type="submit"
                                    class="btn btn-sm btn-outline-danger">
                                    X
                                </button>
                                </form>
                            </div>
                        </li>
                        <!-- Mensaje si no hay categorías -->
                        <li th:if="${#lists.isEmpty(categorias)}" class="list-group-item text-center text-muted py-4">
                            No hay categorías registradas.
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<!-- Script de Bootstrap (opcional, para que funcionen las alertas de cerrar) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
