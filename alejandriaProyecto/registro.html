<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Alejandría</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="estilos.css">

</head>

<body>

<nav class="navbar navbar-expand-lg bg-light">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            <i class="bi bi-book"></i>
            Alejandría
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Inicio
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="libros.html">
                        Libros
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">
                        Contacto
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">
                        <i class="bi bi-person"></i>
                        Iniciar sesión
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<section class="py-5">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-6">

                <h1 class="text-center">
                    Crear cuenta
                </h1>

                <p class="text-center">
                    Regístrate para realizar tus compras.
                </p>

                <form onsubmit="validarRegistro(event)">

                    <div class="mb-3">

                        <label class="form-label">
                            Nombre completo
                        </label>

                        <input type="text" class="form-control" placeholder="Ingresa tu nombre" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Correo electrónico
                        </label>

                        <input type="email" class="form-control" placeholder="Ingresa tu correo" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Contraseña
                        </label>

                        <input type="password" class="form-control" placeholder="Crea una contraseña" required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Confirmar contraseña
                        </label>

                        <input type="password" class="form-control" placeholder="Repite tu contraseña" required>

                    </div>

                    <div class="text-center">

                        <button type="submit" class="btn btn-primary">
                            Registrarme
                        </button>

                    </div>

                </form>

                <p class="text-center mt-3">
                    ¿Ya tienes una cuenta?
                    <a href="login.html">
                        Inicia sesión
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>

<footer class="py-4 bg-chestunt">

    <div class="container">

        <p class="text-center">
            © 2026 Alejandría. Todos los derechos reservados.
        </p>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>

</html>
